<div class="face__snap" [ngClass]="{ snapped: userHasSnapped }">
    <div class="face__snap__card">
    <h2>{{ faceSnap.title }}</h2>
    @if (faceSnap.location) {
        <i>{{ faceSnap.location }}</i>
    } @else {
        <p>Location non spécifié</p>
    }
    <img [src]="faceSnap.imageUrl" [alt]="faceSnap.title">
    <p>{{ faceSnap.description }}</p>
    <p>FaceSnap crée le {{ faceSnap.createdAt }}</p>
    <div class="face__snap__button">
        <button (click)="onSnap()">{{ snapButtonText }}</button>
        <span [ngStyle]="{ color: 'rgb(0,'+ faceSnap.snapsCounter +',0)'}">{{  faceSnap.snapsCounter }}</span>
    </div>
    </div>
</div>
